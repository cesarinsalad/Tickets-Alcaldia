services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistema_tickets_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "Sistema de Tickets"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "base64:eZh3XNPkCPMvFd+i7k4Ywrres36B9p/Ml7GlSYv8aLQ="
      APP_URL: "http://localhost:8000"
      APP_TIMEZONE: "America/Caracas"
      APP_LOCALE: "es"
      
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: sistema_tickets
      DB_USERNAME: sistema_tickets
      DB_PASSWORD: sistema_tickets
      
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: sistema_tickets_db
    restart: always
    environment:
      POSTGRES_DB: sistema_tickets
      POSTGRES_USER: sistema_tickets
      POSTGRES_PASSWORD: sistema_tickets
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
    driver: local
  storage_data:
    driver: local
